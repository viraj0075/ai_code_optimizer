name: Coin Care
description: AI Cost Optimizer bot that reviews PRs and suggests code optimizations.
author: GitHub Cost Optimizer
branding:
  icon: dollar-sign
  color: green

inputs:
  github-token:
    description: GitHub token used to read PR information and post comments.
    required: true
    default: ${{ github.token }}

  fail-on:
    description: "Optional severity that should fail the action: critical, high, medium, low, or none."
    required: false
    default: none

runs:
  using: node24
  main: dist/index.cjs
